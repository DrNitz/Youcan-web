<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A calm web prototype of the Youcan study companion in a nature and ocean themed room.">
  <title>Youcan - Ocean Study Companion</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Youcan</h1>
    <p>A quiet place to study by the sea.</p>
  </header>

  <main>
    <section class="stage" aria-label="Ocean study room">
      <img
        class="scene"
        src="assets/room.jpg"
        alt="A calm study nook by the sea with an open window, a wooden desk, sea grass and a warm lamp"
        width="1024" height="576" fetchpriority="high">

      <button
        id="companion"
        class="companion"
        type="button"
        aria-label="Study companion. Activate to say hello, or drag to move.">
        <svg id="character" class="character" viewBox="0 0 500 600" width="500" height="600" aria-hidden="true">
          <ellipse class="char-shadow" cx="250" cy="556" rx="120" ry="16"/>

          <g class="char-legs">
            <path d="M250 470c-42 0-78 18-104 46 22 28 62 40 104 40s82-12 104-40c-26-28-62-46-104-46z" fill="#6e5540"/>
            <path d="M250 480c-26 0-48 12-66 30 16 18 38 26 66 26s50-8 66-26c-18-18-40-30-66-30z" fill="#8a694e" opacity="0.55"/>
          </g>

          <g class="char-breathe">
            <ellipse cx="250" cy="208" rx="96" ry="104" fill="#3f7c78"/>
            <path d="M172 308c0-48 34-78 78-78s78 30 78 78v168c0 24-18 42-42 42h-72c-24 0-42-18-42-42z" fill="#4f8f8b"/>
            <path d="M250 232c-30 0-52 14-52 34v66c0 20 22 36 52 36s52-16 52-36v-66c0-20-22-34-52-34z" fill="#3f7c78" opacity="0.35"/>

            <g class="char-head">
              <circle cx="250" cy="196" r="68" fill="#f1dfc9"/>
              <path d="M182 196c0-46 30-78 68-78s68 32 68 78c-10-20-30-32-68-32s-58 12-68 32z" fill="#6e5540"/>
              <path d="M182 190c-10 26-6 54 6 72-24-16-34-48-28-76zM318 190c10 26 6 54-6 72 24-16 34-48 28-76z" fill="#6e5540"/>

              <g class="eyes eyes-open">
                <ellipse cx="226" cy="202" rx="6" ry="8" fill="#3a2e26"/>
                <ellipse cx="274" cy="202" rx="6" ry="8" fill="#3a2e26"/>
                <path d="M214 184c8-5 18-5 26 0M260 184c8-5 18-5 26 0" stroke="#6e5540" stroke-width="4" fill="none" stroke-linecap="round"/>
              </g>

              <g class="eyes eyes-happy">
                <path d="M214 204c6-10 18-10 24 0M262 204c6-10 18-10 24 0" stroke="#3a2e26" stroke-width="5" fill="none" stroke-linecap="round"/>
                <circle cx="210" cy="220" r="7" fill="#d9a89a" opacity="0.5"/>
                <circle cx="290" cy="220" r="7" fill="#d9a89a" opacity="0.5"/>
              </g>

              <g class="mouth mouth-normal">
                <path d="M242 226c5 4 11 4 16 0" stroke="#8a694e" stroke-width="4" fill="none" stroke-linecap="round"/>
              </g>
              <g class="mouth mouth-happy">
                <path d="M236 224c8 12 20 12 28 0" stroke="#8a694e" stroke-width="5" fill="none" stroke-linecap="round"/>
              </g>
            </g>

            <path d="M198 258c20 16 34 22 52 22s32-6 52-22l10 28c-20 18-40 26-62 26s-42-8-62-26z" fill="#fbf3e4" stroke="#8a694e" stroke-width="3" stroke-linejoin="round"/>

            <path d="M176 318c-18 26-20 56-8 82 18 8 36 6 52-6l-8-58z" fill="#4f8f8b"/>
            <path d="M324 318c18 26 20 56 8 82-18 8-36 6-52-6l8-58z" fill="#4f8f8b"/>

            <rect x="214" y="352" width="72" height="52" rx="4" fill="#fbf3e4" stroke="#8a694e" stroke-width="4"/>
            <path d="M250 352v52M226 366h14M226 378h14M260 366h14M260 378h14" stroke="#b99a78" stroke-width="3" fill="none"/>
            <circle cx="212" cy="392" r="13" fill="#f1dfc9"/>

            <g class="hand hand-normal">
              <circle cx="288" cy="392" r="13" fill="#f1dfc9"/>
            </g>
            <g class="hand hand-wave">
              <path d="M324 318c6-30 22-52 42-62 16-8 30-4 36 10 8 18-2 34-20 44l-24 14z" fill="#4f8f8b"/>
              <circle cx="398" cy="260" r="14" fill="#f1dfc9"/>
              <path d="M392 246v-12M400 244v-14M408 248v-10" stroke="#8a694e" stroke-width="3" stroke-linecap="round" fill="none"/>
            </g>
          </g>
        </svg>
      </button>

      <div id="speech" class="speech" role="status" hidden>Hello there.</div>
    </section>

    <p class="hint">Tap your companion to say hello. Drag to move them around the room.</p>
    <button id="reset" class="reset" type="button">Move companion back</button>
  </main>

  <footer class="site-footer">
    <p>Prototype scope: character and theme only.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
